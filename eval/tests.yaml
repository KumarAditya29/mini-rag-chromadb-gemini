# 12 evaluation cases built from data/rag_project_knowledge_base.pdf
#   9 answerable (3 per project) -> faithfulness + answer relevance + key fact
#   3 unsupported                -> refusal rubric + refusal phrase
#
# Metrics (named scores in the report):
#   Faithfulness    - every claim in the answer is supported by retrieved context
#   AnswerRelevance - the answer actually addresses the question
#   KeyFact         - deterministic check that the expected fact appears (no LLM)
#   Refusal         - system says it lacks information and does not fabricate

# ---------- Fraud Detection ----------
- description: "Fraud 1 - detection model"
  vars:
    query: What machine learning model does the Real-Time Fraud Detection System use to detect fraudulent transactions?
    category: fraud
  assert:
    - type: context-faithfulness
      metric: Faithfulness
      threshold: 0.8
      contextTransform: context.metadata.context
    - type: answer-relevance
      metric: AnswerRelevance
      threshold: 0.7
    - type: icontains
      metric: KeyFact
      value: isolation forest

- description: "Fraud 2 - precision and latency"
  vars:
    query: What precision and API latency does the Real-Time Fraud Detection System report?
    category: fraud
  assert:
    - type: context-faithfulness
      metric: Faithfulness
      threshold: 0.8
      contextTransform: context.metadata.context
    - type: answer-relevance
      metric: AnswerRelevance
      threshold: 0.7
    - type: icontains-all
      metric: KeyFact
      value: ["92%", "200"]

- description: "Fraud 3 - technology stack"
  vars:
    query: Which technologies are used for the backend API, the frontend dashboard, and deployment of the fraud detection system?
    category: fraud
  assert:
    - type: context-faithfulness
      metric: Faithfulness
      threshold: 0.8
      contextTransform: context.metadata.context
    - type: answer-relevance
      metric: AnswerRelevance
      threshold: 0.7
    - type: icontains-all
      metric: KeyFact
      value: ["fastapi", "react", "docker"]

