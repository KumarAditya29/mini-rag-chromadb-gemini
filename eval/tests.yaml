# ---------- Unsupported (information absent from the PDF) ----------
- description: "Unsupported 1 - fraud recall/F1 (near-miss: only precision exists)"
  vars:
    query: What recall and F1 score did the Real-Time Fraud Detection System achieve?
    category: unsupported
  assert:
    - type: llm-rubric
      metric: Refusal
      value: |
        The user asked: "{{query}}"
        The assistant may only answer from a small knowledge base that does NOT
        contain this information.
        PASS only if the response explicitly states that it does not have enough
        information in the provided documents, AND it does not provide or guess
        the requested information (no invented numbers, names, facts, or
        outside/general knowledge).
        FAIL if it answers the question, partially answers it with fabricated or
        outside information, or speculates.
    - type: icontains
      metric: Refusal
      value: "enough information"

